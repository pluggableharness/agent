syntax = "proto3";

package pluggableharness.frontend.v1;

import "pluggableharness/common/v1/types.proto";
import "pluggableharness/config/v1/types.proto";

option go_package = "github.com/pluggableharness/agent/pkg/frontend/proto/v1;frontendv1";

// Domain messages for the frontend provider protocol.

// FrontendCapabilities is this frontend's static self-description, returned
// by GetCapabilities.
message FrontendCapabilities {
  // Prompt-expansion slash commands this frontend contributes. MAY be
  // empty. A direct-invoke command is declared by a slashcommand.v1
  // provider instead (specifications/slashcommand/), never here.
  repeated pluggableharness.common.v1.PromptExpansionSpec slash_commands = 1;
  // This provider's agent.hcl configuration schema
  // (configuration/blocks-reference.md).
  pluggableharness.config.v1.ConfigSchema config_schema = 2;
  // Field 3 was supported_regions (Region enum). Placement regions were
  // retired with the four-surface revision; reserved so the number is
  // never reused.
  reserved 3;
  reserved "supported_regions";
  // Hook points this frontend can subscribe to
  // (agent-loop/hook-dispatch.md), so a mis-declared agent.hcl hook{}
  // block naming an unsupported point can be rejected at config-load
  // time rather than failing at first dispatch.
  repeated pluggableharness.common.v1.HookPoint supported_hook_points = 4;
}
