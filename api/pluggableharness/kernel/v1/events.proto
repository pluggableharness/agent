syntax = "proto3";

package pluggableharness.kernel.v1;

import "google/protobuf/timestamp.proto";
import "pluggableharness/common/v1/types.proto";
import "pluggableharness/kernel/v1/types.proto";

option go_package = "github.com/pluggableharness/agent/pkg/kernel/proto/v1;kernelv1";

// Occurrence-shaped messages streamed by KernelCallbackService's
// server-streaming RPCs: BusEvent (Subscribe), StoredEvent (ReadEvents),
// and TokenDelta (StreamDeltas).

// BusEvent is one event delivered to a Subscribe stream. See
// kernel-callbacks.md's Subscribe and event-bus.md.
message BusEvent {
  // The event's fully-resolved topic. See event-bus.md#topic-grammar.
  string topic = 1;

  // The event payload, exactly as published. MAY be empty. Opaque to the
  // kernel — see PublishRequest.payload (rpc_request.proto).
  bytes payload = 2;

  // Identifies payload's shape. See PublishRequest.payload_type.
  string payload_type = 3;

  // Versions payload_type. See PublishRequest.schema_version.
  string schema_version = 4;

  // When the kernel received the Publish call this event fans out from.
  // MUST be set. Display-only: never order by this. The bus makes no
  // cross-subscriber ordering guarantee (event-bus.md#delivery-semantics),
  // and .claude/rules/determinism.md is explicit that wall-clock time is
  // never an ordering authority — sequence below is.
  google.protobuf.Timestamp time = 5;

  // The state-backend sequence of the persisted event this republishes,
  // for events on the reserved kernel.event.* topics.
  //
  // Zero for everything else: a plugin's own Publish carries no persisted
  // event and so has no sequence, which is a real distinction rather than
  // a missing value.
  //
  // This exists because a subscriber has to merge two streams — the live
  // bus and a ReadEvents backfill — into one ordered view, and until now
  // only the backfill carried a sequence. A frontend attaching to a
  // session in progress therefore had no way to order a live message
  // against its own replayed history, and sorted new content above it.
  // determinism.md makes sequence the sole ordering authority; a
  // transport that drops it forces every subscriber to invent one.
  int64 sequence = 6;
}

// StoredEvent is one persisted event, read back by ReadEvents. Mirrors
// state-backend.md's events table row. See kernel-callbacks.md's
// ReadEvents.
message StoredEvent {
  // The row's ordering-authoritative sequence number. MUST be set.
  // ReadEvents streams StoredEvents in ascending sequence order — never
  // by time (.claude/rules/determinism.md).
  int64 sequence = 1;

  // The stable, storage-independent event id. MUST be set.
  string id = 2;

  // When this event occurred, wall-clock, display-only — never used to
  // order anything (.claude/rules/determinism.md). MUST be set.
  google.protobuf.Timestamp time = 3;

  // The event's kind. MUST be set.
  EventKind kind = 4;

  // The plugin that originally Emit'd this event, read back from
  // storage — unlike EmitRequest, which never carries a producer field,
  // this is server-populated on write and simply returned here, not
  // server-derived from the calling connection (the caller reading this
  // back may be a different plugin than the one that emitted it). MUST
  // be set.
  pluggableharness.common.v1.ProducerRef producer = 5;

  // The schema version of `payload`. MUST be set. See
  // EmitRequest.schema_version.
  string schema_version = 6;

  // The event payload, exactly as the originating Emit call wrote it.
  // Opaque to the kernel — see EmitRequest.payload.
  bytes payload = 7;
}

// TokenDelta is one live incremental text fragment for the fast path,
// out-of-band with respect to the event bus (no topic matching, no
// filter evaluation, no shared subscriber queue). Per-stream FIFO only;
// not durable and never replayed — finished text arrives as RenderTrees
// via ReadEvents. See kernel-callbacks.md's StreamDeltas.
message TokenDelta {
  // The session this delta belongs to. MUST be set.
  string session_id = 1;
  // Identifies which displayed element this delta appends to (e.g. a
  // RenderNode id from a prior render), for correlating consecutive
  // deltas into one growing piece of text.
  string target_id = 2;
  // The incremental text to append.
  string text = 3;

  // Which of the model's output streams this fragment belongs to.
  //
  // Without it a frontend cannot tell reasoning from the answer on the
  // fast path, so it must either show both as the reply — which reads as
  // the model talking to itself — or show neither, which is what left
  // reasoning invisible while a turn was thinking. Unset means text, so a
  // producer written before this field behaves exactly as before.
  DeltaKind kind = 4;
}

// DeltaKind names which model output stream a TokenDelta carries.
//
// Deliberately coarser than model.v1's ThinkingChannel: a frontend needs
// to know that reasoning is happening, not which of a vendor's two
// reasoning streams produced a fragment. The finer distinction survives on
// the durable message, where a reader can act on it.
enum DeltaKind {
  // Zero value, and the assistant's ordinary reply text — a producer that
  // never sets this field emits reply text, which is what every producer
  // written before this enum did.
  DELTA_KIND_UNSPECIFIED = 0;
  // The model's reasoning output, of any channel.
  DELTA_KIND_THINKING = 1;
}
