syntax = "proto3";

package pluggableharness.model.v1;

import "google/protobuf/timestamp.proto";
import "pluggableharness/common/v1/types.proto";
import "pluggableharness/config/v1/types.proto";
import "pluggableharness/schema/v1/types.proto";

option go_package = "github.com/pluggableharness/agent/pkg/model/proto/v1;modelv1";

// Domain messages and enums shared across ModelService's requests, responses, and events.

// Capabilities is GetCapabilities' response payload: every model this
// plugin can serve, plus provider-wide declarations that apply once, not
// per model.
message Capabilities {
  // One ModelSpec per model the plugin can serve. MUST have at least one
  // entry.
  repeated ModelSpec models = 1;

  // Prompt-expansion slash commands this provider contributes, declared
  // once for the provider as a whole (not per model), per model.md §2
  // and configuration.md §5 / frontend.md §5. MAY be empty. A
  // direct-invoke command is declared by a slashcommand.v1 provider
  // instead (specifications/slashcommand/), never here.
  repeated pluggableharness.common.v1.PromptExpansionSpec slash_commands = 2;

  // The provider's agent.hcl config schema, returned alongside
  // capabilities so the kernel knows what fields Configure expects, per
  // configuration.md §4.
  pluggableharness.config.v1.ConfigSchema config_schema = 3;

  // Which hook points (agent-loop/hook-dispatch.md) this plugin can serve
  // via HookSubscriberService.DispatchHook. The kernel MUST reject an
  // agent.hcl hook{} block naming a point not present here, at
  // config-load time.
  //
  // Typed as common.v1.HookPoint, not hook.v1.HookPoint: hook/v1/events.proto
  // imports model/v1/types.proto (for ModelRef/Usage on its PreModelCall/
  // PostModelResponse hook payloads), so model/v1/types.proto importing
  // anything from hook.v1 for this field would be a cyclic file dependency — confirmed via
  // `buf build`, which rejects it outright ("detected cyclic import").
  // HookPoint itself lives in common.v1 for exactly this reason (see
  // common/v1/types.proto), already imported here for CallContext/Describe.
  repeated pluggableharness.common.v1.HookPoint supported_hook_points = 4;

  // How this plugin authenticated and which pool it meters against, when
  // it can say. MAY be absent — a provider with one credential shape has
  // nothing to disambiguate.
  optional AuthDescriptor auth = 5;

  // The vendor's version identifier for the model catalog this roster
  // was built from (an `x-models-etag`), when the provider fetched one.
  //
  // Reported so a mismatch against a StreamMetadata.catalog_etag on a
  // later completion is *detectable*. Acting on it requires the kernel
  // to be able to re-fetch capabilities, which this protocol revision
  // does not add — the roster is still resolved once at Configure. Ship
  // this now so a provider need not re-advertise when refresh lands.
  optional string catalog_etag = 6;

  // When this roster was fetched from the vendor. Absent for a
  // hand-written roster compiled into the plugin, which is exactly the
  // distinction it exists to make: a static roster is never stale, while
  // a fetched one has an age.
  optional google.protobuf.Timestamp catalog_fetched_at = 7;
}

// AuthMethod names the credential shape a model plugin is running under.
//
// It matters beyond bookkeeping: which models a vendor exposes, which
// endpoint answers, and which terms of service apply all differ by
// credential. A frontend that cannot tell a subscription session from a
// console key cannot warn an operator which one they are spending.
enum AuthMethod {
  // Zero value: the provider did not say. Not an error — declaring this
  // is optional.
  AUTH_METHOD_UNSPECIFIED = 0;
  // A console/platform API key billed per token.
  AUTH_METHOD_API_KEY = 1;
  // An interactive product session (a ChatGPT or Grok login), metered
  // against that product's subscription pool.
  AUTH_METHOD_PRODUCT_SESSION = 2;
  // A cloud deployment credential (Azure, Bedrock, Vertex) where billing
  // belongs to the hosting account rather than the model vendor.
  AUTH_METHOD_DEPLOYMENT_KEY = 3;
}

// MeteringDomain names what a completion is actually charged against.
//
// Separate from AuthMethod because the two are not one-to-one: a product
// session can be billed against credits once a pool is exhausted.
enum MeteringDomain {
  // Zero value: the provider did not say.
  METERING_DOMAIN_UNSPECIFIED = 0;
  // A subscription pool, where the scarce resource is quota rather than
  // currency and computed cost_usd is not what the operator is spending.
  METERING_DOMAIN_SUBSCRIPTION_POOL = 1;
  // Per-token billing against an invoice, where computed cost_usd is a
  // real prediction of a real charge.
  METERING_DOMAIN_METERED_API = 2;
}

// AuthDescriptor is the non-secret description of how a model plugin is
// authenticated.
//
// Nothing here is a credential, and nothing here may be derived from one
// in a way that leaks it: no key material, no token, no refresh token,
// no full account identifier. .claude/rules/logging-telemetry.md's
// no-secrets rule applies to every field with no exception, including
// the labels map.
message AuthDescriptor {
  // The credential shape in use.
  AuthMethod method = 1;

  // What completions are charged against.
  MeteringDomain metering = 2;

  // The vendor's plan name, where a subscription names one ("plus",
  // "pro", "SuperGrok"). Display only; the kernel never routes on it.
  optional string plan = 3;

  // Additional non-secret, vendor-defined labels — a redacted account
  // handle, a region, an organization display name.
  //
  // The kernel MUST serialize this with sorted keys wherever it reaches
  // a persisted payload; Go map iteration order is randomized and would
  // otherwise make the same state serialize differently across runs
  // (.claude/rules/determinism.md).
  map<string, string> labels = 4;
}

// AccountSnapshot is the live account and entitlement state behind a
// model plugin's credential, as returned by GetAccount.
//
// It answers the question a subscription operator actually has — "how
// much of my pool is left, and on which plan" — which no per-completion
// message can answer before the first completion runs. The quota list
// reuses RateLimitSnapshot rather than introducing a parallel shape:
// pool headroom and a rate-limit budget are the same concept read at
// different times, and two types for it would guarantee two frontend
// renderers that disagree.
message AccountSnapshot {
  // The credential shape in use.
  AuthMethod method = 1;

  // What completions are charged against.
  MeteringDomain metering = 2;

  // The vendor's plan name, where a subscription names one. Display
  // only; the kernel never routes on it.
  optional string plan = 3;

  // Non-secret, vendor-defined labels — a redacted account handle, a
  // region, an organization display name. The no-secrets rule on
  // AuthDescriptor.labels applies here identically.
  map<string, string> labels = 4;

  // Every budget the vendor publishes for this account outside a
  // completion: pool percentages, credit balances, request ceilings.
  // MAY be empty — a vendor that publishes budgets only in completion
  // response headers reports them on Usage instead.
  repeated RateLimitSnapshot quotas = 5;

  // When this snapshot was read from the vendor. Lets a frontend say how
  // stale the figure is rather than presenting a cached reading as live,
  // which is the specific failure mode that makes an operator distrust a
  // usage meter.
  optional google.protobuf.Timestamp fetched_at = 6;
}

// ModelSpec describes one model this provider can serve, per
// model.md §2. Every field below is MUST unless its comment says
// otherwise.
message ModelSpec {
  // The vendor's exact model identifier, used to select this model in
  // StreamCompletionRequest.model_id.
  string id = 1;

  // The model's input token budget.
  int64 context_window = 2;

  // The model's maximum output tokens per response.
  int64 max_output_tokens = 3;

  // Whether this model can accept tool declarations and emit tool_use
  // content blocks.
  bool supports_tool_use = 4;

  // Whether this model can accept image content blocks.
  bool supports_vision = 5;

  // Whether the vendor's own backend streams responses. A UX hint only
  // (e.g. "don't render a live-typing cursor" when false) — the
  // StreamCompletion RPC shape is always server-streaming regardless of
  // this value, per model.md §1/§4.
  bool supports_streaming = 6;

  // Whether this model can return multiple tool_use blocks in a single
  // turn. SHOULD be set accurately; a false or absent value means the
  // kernel MUST serialize tool calls for this model.
  optional bool supports_parallel_tool_calls = 7;

  // This model's extended-reasoning capability. MUST be present even when
  // unsupported — use { supported: false } rather than omitting the
  // message, so a caller never has to distinguish "unset" from "no
  // thinking mode".
  ThinkingSpec thinking = 8;

  // This model's prompt-caching capability. MUST be present even when
  // unsupported — use { supported: false } rather than omitting the
  // message.
  CachingSpec caching = 9;

  // This model's pricing. MUST be present even for a free model (set
  // Pricing.free = true).
  Pricing pricing = 10;

  // Which GenerationParams.tool_choice.mode values this model accepts.
  // SHOULD declare precisely which subset a vendor supports rather than
  // collapsing to a bool, mirroring ThinkingSpec/CachingSpec's sum-type
  // rationale above — vendors differ in which of AUTO/ANY/NONE/SPECIFIC
  // they expose. Empty means this model does not support constraining
  // tool choice at all (only free-form model-decides behavior); the
  // kernel MUST NOT send a GenerationParams.tool_choice with a mode
  // absent from this list.
  repeated ToolChoiceMode supported_tool_choice_modes = 11;

  // Whether this model can accept document content blocks (content.v1
  // DocumentBlock, e.g. inline PDFs). Mirrors supports_vision's rule:
  // the kernel MUST reject a DocumentBlock sent to a model where this is
  // false, with invalid_request, rather than silently dropping it.
  bool supports_documents = 12;

  // Human-facing catalog metadata for a model picker. Absent for a
  // provider with a hand-written roster and nothing to say beyond the
  // id.
  optional CatalogMetadata catalog = 13;

  // The largest context window this model can be configured with, where
  // the vendor exposes a ceiling above the default context_window (a
  // long-context variant billed at a different tier).
  //
  // context_window remains the figure the kernel budgets against;
  // this is the headroom a picker can offer, not a silent upgrade.
  optional int64 max_context_window = 14;

  // The fraction of context_window, 0-100, that is actually usable for
  // conversation after the vendor's own fixed overhead.
  //
  // Vendors publish a round context_window and then reserve part of it,
  // which is why a session can hit a limit well below the advertised
  // number. Absent means the whole window is usable.
  optional double effective_context_window_percent = 15;

  // The assembled-token count at which a harness should compact this
  // model's history, where the vendor recommends one. Advisory: the
  // kernel's own compaction policy decides, and MUST NOT treat this as a
  // hard bound.
  optional int64 auto_compact_token_limit = 16;

  // The model's output-verbosity control, where it exposes one.
  optional VerbositySpec verbosity = 17;

  // The service or speed tiers this model can be served at, in the
  // vendor's own naming. Empty means the vendor exposes no tier choice.
  repeated string service_tiers = 18;

  // Which vendor API surface serves this model ("chat_completions",
  // "responses", "messages"), for vendors exposing several with
  // different capabilities.
  //
  // Opaque to the kernel — it never routes on this. It exists so a
  // provider serving one roster across two backends can record which is
  // which instead of splitting into two plugins.
  optional string api_backend = 19;

  // The vendor's policy name for truncating oversized tool output, where
  // it defines one. Opaque to the kernel.
  optional string truncation_policy = 20;

  // The vendor's compaction-compatibility identifier, where it publishes
  // one. Two models sharing a value can consume each other's compacted
  // history; differing values mean a compaction cannot be carried
  // across. Opaque to the kernel.
  optional string comp_hash = 21;
}

// CatalogMetadata is the human-facing description of a model — what a
// picker shows, not what the kernel routes on.
//
// Grouped into its own message rather than flattened onto ModelSpec
// because none of it is behavioral: a kernel that ignored this message
// entirely would route, budget, and bill identically. Keeping the
// separation makes that obvious at a glance instead of leaving a reader
// to work out which of twenty ModelSpec fields change behavior.
message CatalogMetadata {
  // The model's display name ("Grok 4.5", "GPT-5 Codex"), for a picker.
  // Absent means a frontend falls back to ModelSpec.id.
  optional string display_name = 1;

  // A one-line description of what the model is for.
  optional string description = 2;

  // Whether this model should be offered in a picker by default.
  // Vendors publish models that exist but are deprecated, internal, or
  // gated; absent means visible.
  optional bool visible = 3;

  // A sort weight for a picker, higher first. Absent means unranked, and
  // a frontend orders by whatever it likes.
  optional int32 priority = 4;

  // Whether this model is reachable with an API key, as opposed to only
  // through a product session.
  //
  // Paired with AuthDescriptor.method this is what lets a frontend hide
  // models the current credential cannot actually reach, instead of
  // offering one that fails at first use.
  optional bool supported_in_api = 5;

  // Other ids that resolve to this same model. A vendor publishing
  // `grok-4` as an alias of `grok-4.3` lists it here.
  //
  // Aliases are NOT separate ModelSpec entries: expanding them into one
  // spec each is what makes a catalog appear to hold several distinct
  // models that are one model, and makes a picker offer the same thing
  // three times.
  repeated string aliases = 6;

  // The model family this belongs to, for grouping variants that differ
  // only by size or revision. Opaque to the kernel.
  optional string family = 7;
}

// VerbositySpec declares a model's output-verbosity control, where the
// vendor exposes one — a knob distinct from thinking effort, which
// governs reasoning depth rather than answer length.
message VerbositySpec {
  // Whether this model accepts a verbosity setting at all. When false,
  // levels MUST be empty and default MUST be absent.
  bool supported = 1;

  // The accepted level names, in the vendor's own vocabulary ("low",
  // "medium", "high"), ordered least to most verbose.
  repeated string levels = 2;

  // The level applied when a request names none. MUST be one of levels
  // when set.
  optional string default = 3;
}

// ThinkingDisableSupport describes whether a model's reasoning can be
// turned off, per model/data-types.md#thinkingspec. A plain bool cannot
// express the real answer for every model: Anthropic's Opus 5 accepts an
// explicit disable at effort "high" or below and returns a 400 at "xhigh"
// or "max", so both true and false are wrong for it.
enum ThinkingDisableSupport {
  // Zero value. Never valid when ThinkingSpec.supported is true; its
  // presence on the wire means a caller forgot to set the field.
  THINKING_DISABLE_SUPPORT_UNSPECIFIED = 0;
  // Reasoning cannot be turned off in any configuration — a researched
  // Grok model defaults reasoning on with no off switch, and Anthropic's
  // Fable 5 returns a 400 for an explicit disable. Also the correct value
  // when ThinkingSpec.supported is false: there is nothing to disable.
  THINKING_DISABLE_SUPPORT_NEVER = 1;
  // An explicit disable is accepted in every configuration.
  THINKING_DISABLE_SUPPORT_ALWAYS = 2;
  // An explicit disable is accepted in some configurations and rejected in
  // others. This protocol deliberately does not model WHICH: the condition
  // is vendor-specific and expressing it would need a general constraint
  // language. What this value buys the kernel is knowing that a failed
  // disable attempt is a vendor policy response, not an adapter bug.
  THINKING_DISABLE_SUPPORT_CONDITIONAL = 3;
}

// ThinkingBudgetRange bounds the token budget a caller may request on a
// model whose ThinkingSpec declares a BudgetControl. Both bounds are
// inclusive.
message ThinkingBudgetRange {
  // The smallest thinking-token budget this model accepts.
  int64 min = 1;
  // The largest thinking-token budget this model accepts.
  int64 max = 2;
}

// EffortControl declares that a model accepts a named reasoning-effort
// level, and which levels, per model/data-types.md#thinkingspec.
message EffortControl {
  // The selectable effort levels, e.g. ["low","medium","high","xhigh",
  // "max"]. MUST be non-empty — a model with no selectable levels omits
  // the whole EffortControl instead.
  repeated string levels = 1;

  // The level the vendor applies when a request omits effort entirely.
  // MUST be set, and MUST be one of `levels` — makes the vendor's actual
  // default behavior visible/auditable via GetCapabilities rather than
  // hidden in adapter code, so a kernel wanting deterministic behavior can
  // always send an explicit override.
  string default = 2;
}

// BudgetControl declares that a model accepts an explicit reasoning-token
// budget, and its bounds, per model/data-types.md#thinkingspec.
message BudgetControl {
  // The accepted token-budget range. MUST be present.
  ThinkingBudgetRange range = 1;

  // The budget the vendor applies when a request omits one. MAY be
  // omitted, which means the vendor reasons zero tokens by default.
  optional int64 default = 2;

  // Whether the vendor still honors this control but steers callers to
  // effort/adaptive instead, and MAY remove it in a later model. This
  // status is per-model, never per-vendor: Anthropic's Opus 4.6 and
  // Sonnet 4.6 accept a deprecated budget, Haiku 4.5 accepts ONLY the
  // budget, and Opus 4.7 onward reject it with a 400 (declared by omitting
  // BudgetControl entirely, not by setting this flag).
  bool deprecated = 3;
}

// ThinkingSpec describes one model's extended-reasoning capability, per
// model/data-types.md#thinkingspec.
//
// These are independent axes, not one-of-N modes. A model MAY reason
// adaptively AND expose an effort ladder (Anthropic Opus 4.8, Sonnet 5),
// or accept an effort level AND a deprecated token budget (Opus 4.6,
// Sonnet 4.6). An earlier revision modeled this as a single mutually-
// exclusive enum, which forced every such model to declare a half-truth.
message ThinkingSpec {
  reserved 2 to 6;

  reserved "budget_range", "can_disable", "default", "effort_levels", "mode";

  // Whether this model has any extended-reasoning capability at all. When
  // false, effort and budget MUST both be absent and adaptive_by_default
  // MUST be false; `disable` is meaningless (there is nothing to disable),
  // so UNSPECIFIED and NEVER are equivalent and a reader MUST treat them
  // identically. That equivalence is what keeps an all-zero ThinkingSpec a
  // valid declaration for a model that does not reason — the common case.
  // Only a positive claim that reasoning CAN be turned off (ALWAYS or
  // CONDITIONAL) contradicts supported == false.
  bool supported = 1;

  // The named-effort-level control, present iff this model accepts one.
  // Absent means sending GenerationParams.thinking_effort to this model is
  // a kernel-level reject, not something forwarded to the vendor.
  optional EffortControl effort = 7;

  // The explicit-token-budget control, present iff this model accepts one.
  // A model that never had one, and a model whose vendor removed it,
  // both declare it absent.
  optional BudgetControl budget = 8;

  // Whether omitting every thinking control still produces reasoning.
  // False means an unconfigured request reasons zero tokens.
  bool adaptive_by_default = 9;

  // Whether, and when, reasoning can be turned off. MUST be set when
  // supported is true.
  ThinkingDisableSupport disable = 10;

  // Whether this model can emit a reasoning *summary* distinct from its
  // raw reasoning stream. When true, a StreamEvent's thinking deltas may
  // carry a channel distinguishing the two.
  optional bool supports_reasoning_summary = 11;

  // The summary mode applied when a request names none, in the vendor's
  // own vocabulary ("auto", "concise", "detailed"). Meaningless unless
  // supports_reasoning_summary is true.
  optional string default_reasoning_summary = 12;
}

// CachingSpec describes one model's prompt-caching capability, per
// model/data-types.md#cachingspec.
//
// These are independent axes, not one-of-N modes, for the same reason
// ThinkingSpec's are: Google's Gemini 2.5 and later run implicit automatic
// caching by default AND offer explicit manual declaration concurrently at
// a deeper discount. An earlier revision modeled this as a single
// mutually-exclusive enum, which forced such a model to under-declare
// itself — and, because cache_breakpoints were gated on that enum naming
// EXPLICIT_MARKERS, required it to discard breakpoints it could in fact
// have honored.
message CachingSpec {
  reserved 2;

  reserved "mode";

  // Whether this model has any prompt-caching capability at all. When
  // false, explicit_markers and implicit_automatic MUST both be false;
  // when true, at least one of them MUST be true — a model caching by a
  // mechanism this protocol cannot name is not declarable, and declaring
  // neither reads as "no caching" to every caller.
  bool supported = 1;

  // Whether this provider runs its own cache-keepalive loop (e.g. a
  // background goroutine re-pinging before a cache TTL expires, so a long
  // tool-execution gap doesn't let the cache go cold). MUST be set,
  // default false. Cache TTL mechanics are vendor-specific, so per
  // operator decision this is a provider-owned behavior the kernel never
  // drives — this field only tells the kernel/operator whether a given
  // provider implements the optimization.
  bool keepalive_supported = 3;

  // Whether the caller may place cache breakpoints on content blocks and
  // have the adapter translate them into vendor-native markers (an
  // Anthropic cache_control block, a Mistral prompt_cache_key). This is
  // the axis StreamCompletionRequest.cache_breakpoints is gated on: an
  // adapter for a model that does not declare it MUST ignore that field
  // rather than error on it.
  bool explicit_markers = 4;

  // Whether the vendor caches transparently above some token threshold
  // with no caller action. Declaring this requires nothing of the kernel;
  // it exists so cache-hit and cost behavior are explicable rather than
  // surprising.
  bool implicit_automatic = 5;
}

// PricingTier is one time-bounded, input-size-bounded rate within a
// model's Pricing, per model.md §2. Exactly one tier MUST match at any
// given (timestamp, input_token_count) pair — timestamp resolved against
// effective_from/effective_until (an omitted bound unbounded on that
// side) AND input_token_count resolved against input_tokens_from/
// input_tokens_until (likewise unbounded when omitted) simultaneously;
// the kernel MUST reject a Pricing value at capability-load time if its
// tiers overlap or leave a gap across either dimension, exactly as it
// already does for the time dimension alone.
message PricingTier {
  // The moment this tier becomes active. Omitted means "since this plugin
  // version was published". Refines model.md §2's "ISO 8601
  // date/timestamp" into the native well-known type.
  optional google.protobuf.Timestamp effective_from = 1;

  // The moment this tier stops being active. Omitted means "still
  // current" — an omitted effective_until marks the currently active
  // tier. Refines model.md §2's "ISO 8601" into the native well-known
  // type.
  optional google.protobuf.Timestamp effective_until = 2;

  // Cost per million input tokens, realtime rate.
  double input_per_mtok = 3;

  // Cost per million output tokens, realtime rate.
  double output_per_mtok = 4;

  // Cost per million cache-write tokens. MUST be present iff
  // CachingSpec.supported.
  optional double cache_write_per_mtok = 5;

  // Cost per million cache-read tokens, typically far cheaper than
  // input_per_mtok — the entire point of caching. MUST be present iff
  // CachingSpec.supported.
  optional double cache_read_per_mtok = 6;

  // A vendor's discounted batch/async input rate, where one exists (e.g.
  // a researched Gemini batch tier). MAY be present.
  optional double batch_input_per_mtok = 7;

  // A vendor's discounted batch/async output rate, paired with
  // batch_input_per_mtok. MAY be present.
  optional double batch_output_per_mtok = 8;

  // The smallest accumulated-input-token count this tier applies to,
  // inclusive. Omitted means unbounded below (matches any input size down
  // to zero). Real vendors price by input size as well as by time — e.g.
  // a distinct, higher rate once a request's input exceeds 200k tokens —
  // and this field lets a tier declare that dimension alongside the
  // existing effective_from/effective_until time bounds. Refines
  // model/data-types.md#pricing's tier-matching rule into two dimensions.
  optional int64 input_tokens_from = 9;

  // The input-token count this tier stops applying to, exclusive.
  // Omitted means unbounded above. Half-open with input_tokens_from,
  // matching effective_from/effective_until's half-open convention.
  optional int64 input_tokens_until = 10;

  // Price per million image input tokens, where the vendor rates image
  // input separately from text.
  //
  // Absent means image input bills at input_per_mtok — the correct
  // reading for every vendor that does not price it separately, and the
  // behavior before this field existed.
  optional double image_input_per_mtok = 11;

  // Price per million audio input tokens, on the same terms as
  // image_input_per_mtok.
  optional double audio_input_per_mtok = 12;
}

// Pricing describes one model's cost structure, per model.md §2. MUST
// be present on every ModelSpec, even a free one.
message Pricing {
  // The pricing currency. MUST be "USD" for v1; reserved for future
  // multi-currency support, not acted on by the kernel yet.
  string currency = 1;

  // True for a local/free-to-run model (e.g. an Ollama-served model).
  // When true, tiers MAY be omitted entirely.
  bool free = 2;

  // This model's rate tiers, ordered or not — resolution is by
  // effective_from/effective_until, not array position. MUST have at
  // least one entry unless free == true. Exactly one tier MUST match any
  // given timestamp; the kernel MUST reject overlapping or gapped tiers
  // at capability-load time.
  repeated PricingTier tiers = 3;

  // The vendor's own pricing unit these rates were converted from, when
  // the adapter had to convert — an integer per-token price, a tick
  // scale, a per-thousand rate.
  //
  // Recorded for audit, never used in computation: the kernel bills from
  // the per-MTok rates above regardless. It exists because the
  // conversion is otherwise adapter-private, which makes a ledger figure
  // that disagrees with a vendor invoice impossible to trace back to
  // whether the rate or the arithmetic was wrong.
  optional string source_unit = 4;
}

// CacheBreakpoint marks one position in a StreamCompletionRequest where
// the kernel wants the adapter to insert a vendor-native cache-control
// marker, per StreamCompletionRequest.cache_breakpoints above.
message CacheBreakpoint {
  // The position this breakpoint marks. Exactly one variant is set.
  oneof position {
    // Immediately after the assembled_context chain — the kernel's most
    // common choice, since assembled_context is usually the longest
    // stable prefix (context/data-types.md#ordering--chaining orders
    // STABILITY_STATIC sections before STABILITY_DYNAMIC ones).
    AfterAssembledContext after_assembled_context = 1;

    // Immediately after the tools declaration list.
    AfterTools after_tools = 2;

    // Immediately after the message at this zero-based index within
    // `messages`.
    int64 after_message_index = 3;
  }

  // AfterAssembledContext is an empty marker message: its presence as the
  // set oneof variant is the entire signal, no further data needed.
  message AfterAssembledContext {}

  // AfterTools is an empty marker message: its presence as the set oneof
  // variant is the entire signal, no further data needed.
  message AfterTools {}
}

// ToolDeclaration is one tool the model may call on this turn, per
// model.md §6. Each model-provider adapter translates this into its
// vendor's own tool-definition wire format.
message ToolDeclaration {
  // The tool's name, as the model must reference it in a ToolUseBlock.
  string name = 1;

  // Human-readable description shown to the model to help it decide
  // whether and how to call this tool.
  string description = 2;

  // The tool's input shape, in the restricted JSON-Schema subset shared
  // across categories (model.md §6, pluggableharness.schema.v1.Schema).
  pluggableharness.schema.v1.Schema input_schema = 3;
}

// GenerationParams carries per-request overrides of otherwise
// model-default generation behavior.
message GenerationParams {
  // Selects one of ThinkingSpec.effort_levels. Meaningful only when the
  // target model's ThinkingSpec.mode == THINKING_MODE_DISCRETE_EFFORT.
  optional string thinking_effort = 1;

  // Selects a token budget within ThinkingSpec.budget_range. Meaningful
  // only when the target model's ThinkingSpec.mode ==
  // THINKING_MODE_CONTINUOUS_BUDGET.
  optional int64 thinking_budget_tokens = 2;

  // Per-request override of ModelSpec.max_output_tokens. Omitted means
  // use the model's default.
  optional int64 max_output_tokens = 3;

  // Sampling temperature. Omitted means use the model's default. Range
  // and exact semantics are vendor-specific; the kernel does not clamp
  // or reinterpret this value, it is passed through to the adapter as
  // given.
  optional double temperature = 4;

  // Sequences that, if generated, MUST cause the model to stop before
  // producing them. Omitted/empty means no caller-supplied stop
  // sequences. When a vendor honors one of these, the plugin MUST report
  // it back via StreamEvent.Stop.matched_stop_sequence with StopReason
  // STOP_REASON_STOP_SEQUENCE.
  repeated string stop_sequences = 5;

  // Constrains whether/how the model must use a tool this turn. Omitted
  // means the model decides freely (equivalent to
  // TOOL_CHOICE_MODE_AUTO). Meaningful only when the target model's
  // ModelSpec.supported_tool_choice_modes is non-empty; the kernel MUST
  // NOT send a mode absent from that list, mirroring
  // thinking_effort/thinking_budget_tokens' ThinkingSpec-validation rule
  // above — an unsupported mode is a kernel-level reject-or-fallback, not
  // something forwarded to the vendor.
  optional ToolChoice tool_choice = 6;

  // The service or speed tier to serve this request at. MUST be one of
  // the target ModelSpec.service_tiers; the kernel rejects a tier the
  // model does not advertise rather than forwarding it, matching
  // tool_choice's own validate-then-send rule above.
  optional string service_tier = 7;

  // The output-verbosity level — answer length, distinct from
  // thinking_effort's reasoning depth. MUST be one of the target
  // model's VerbositySpec.levels.
  optional string verbosity = 8;

  // Constrains the response to a structured format.
  optional ResponseFormat response_format = 9;

  // An opaque key grouping requests the vendor should cache together.
  //
  // Typed rather than left to provider_options because the kernel does
  // act on caching — cache_read_tokens and cache_write_tokens feed
  // cost_usd, and data-types.md's provider_options rule is explicit that
  // a field affecting cost computation cannot live there.
  optional string prompt_cache_key = 10;

  // Whether the vendor should retain this request server-side, for
  // vendors that offer it. Absent leaves the vendor's own default.
  optional bool store = 11;

  // Overrides ModelSpec.supports_parallel_tool_calls for this one
  // request. MUST NOT be set true for a model that does not support it.
  optional bool parallel_tool_calls = 12;

  // The reasoning-summary mode for this request, where the model
  // advertises ThinkingSpec.supports_reasoning_summary.
  optional string reasoning_summary = 13;
}

// ResponseFormat constrains a completion's shape, for vendors offering
// structured output.
message ResponseFormat {
  // The format kind.
  ResponseFormatKind kind = 1;

  // The JSON Schema the response MUST conform to. Required when kind is
  // RESPONSE_FORMAT_KIND_JSON_SCHEMA, meaningless otherwise.
  //
  // Uses the same restricted JSON-Schema subset as tool parameters
  // (schema.v1), deliberately: a vendor accepting one and not the other
  // is an adapter concern, and two schema dialects in one protocol would
  // be two things for a plugin author to learn.
  optional pluggableharness.schema.v1.Schema json_schema = 2;

  // A name for the schema, where the vendor requires one.
  optional string schema_name = 3;
}

// ResponseFormatKind names the structured-output modes.
enum ResponseFormatKind {
  // Zero value. Never valid on a set ResponseFormat.
  RESPONSE_FORMAT_KIND_UNSPECIFIED = 0;
  // Ordinary free-form text.
  RESPONSE_FORMAT_KIND_TEXT = 1;
  // Any syntactically valid JSON, with no schema constraint.
  RESPONSE_FORMAT_KIND_JSON_OBJECT = 2;
  // JSON conforming to json_schema.
  RESPONSE_FORMAT_KIND_JSON_SCHEMA = 3;
}

// ToolChoiceMode enumerates the tool-invocation constraint shapes found
// across researched vendors, per the same "declare precisely, don't
// collapse to a bool" reasoning as ThinkingMode/CachingMode above.
enum ToolChoiceMode {
  // Zero value. Never valid on a real ToolChoice; its presence on the
  // wire means a caller forgot to set the field.
  TOOL_CHOICE_MODE_UNSPECIFIED = 0;
  // The model decides freely whether and which tool to call. Equivalent
  // to omitting GenerationParams.tool_choice entirely.
  TOOL_CHOICE_MODE_AUTO = 1;
  // The model MUST call some tool this turn, but may pick which one.
  TOOL_CHOICE_MODE_ANY = 2;
  // The model MUST NOT call any tool this turn, even if tools were
  // declared.
  TOOL_CHOICE_MODE_NONE = 3;
  // The model MUST call the specific tool named in ToolChoice.tool_name.
  TOOL_CHOICE_MODE_SPECIFIC = 4;
}

// ToolChoice carries one request's tool-invocation constraint, per
// GenerationParams.tool_choice above.
message ToolChoice {
  // Which constraint shape applies. MUST be set.
  ToolChoiceMode mode = 1;

  // The tool the model MUST call. MUST be set, and MUST name a tool
  // present in StreamCompletionRequest.tools, when mode ==
  // TOOL_CHOICE_MODE_SPECIFIC; meaningless and MUST be omitted for every
  // other mode.
  optional string tool_name = 2;
}

// Usage carries token accounting for one completion, per model.md §4.1.
// The kernel computes and persists cost_usd from these counts plus the
// matching PricingTier — the plugin never computes cost itself. Promoted
// to a top-level message, rather than nested under StreamEvent, because
// it is reused outside the stream (event payloads, frontend usage
// updates — forthcoming).
message Usage {
  // Input tokens consumed by this completion.
  int64 input_tokens = 1;
  // Output tokens produced by this completion.
  int64 output_tokens = 2;
  // Tokens read from cache, if the model supports caching. Never also
  // counted in input_tokens.
  optional int64 cache_read_tokens = 3;
  // Tokens written to cache, if the model supports caching. Never also
  // counted in input_tokens.
  optional int64 cache_write_tokens = 4;
  // Thinking/reasoning tokens, when the vendor reports them as a
  // distinct count (ThinkingSpec.supported models only). Never also
  // counted in output_tokens — a vendor that folds reasoning tokens into
  // its reported output_tokens has no separate figure to report here, so
  // this stays unset in that case rather than being derived/subtracted.
  // Billed at the output rate (PricingTier.output_per_mtok) unless a
  // future Pricing revision declares a distinct reasoning rate — there is
  // none as of this revision.
  optional int64 reasoning_tokens = 5;

  // The vendor's own rate-limit state as of this completion, when it
  // reports any. MAY be empty — a vendor that publishes nothing has
  // nothing to declare, and an adapter MUST NOT synthesize a snapshot.
  //
  // Repeated because vendors publish several budgets at once and they
  // exhaust independently: OpenAI and xAI return separate request and
  // token headers, Anthropic reports input and output separately. Naming
  // which budget is close to empty is the whole point — "you have 2%
  // left" is unactionable without saying 2% of what.
  repeated RateLimitSnapshot rate_limits = 6;

  // What the vendor says this completion cost, in the vendor's own
  // denomination, when it reports a figure at all (xAI returns
  // `cost_in_usd_ticks`).
  //
  // Reported, never authoritative. The kernel still computes and
  // persists cost_usd from the token counts above plus the matching
  // PricingTier, and every rollup, budget, and replay reads that
  // computed figure — see model.md §4.1. This field is persisted
  // alongside it for display and reconciliation, so an operator can see
  // that list price and actual bill disagree instead of having to guess.
  // Making it authoritative would put two costs in the ledger with no
  // deterministic rule for which one a replay reproduces
  // (.claude/rules/determinism.md).
  optional VendorCost vendor_cost = 7;

  // The vendor's own total-token figure, when it publishes one that is
  // not simply the sum of the parts above. Recorded rather than
  // recomputed precisely so a disagreement stays visible; the kernel
  // never derives this and never bills from it.
  optional int64 vendor_total_tokens = 8;

  // Vendor-defined counters with no first-class field: per-modality
  // input tokens (text/image/audio), accepted/rejected prediction
  // tokens, hosted-tool source counts. Opaque to the kernel, which
  // stores and surfaces them without interpretation.
  //
  // The kernel MUST sort these by name before persisting: a repeated
  // field reaching a persisted payload in adapter-emission order would
  // make the event log depend on map iteration inside the adapter
  // (.claude/rules/determinism.md).
  repeated UsageComponent components = 9;

  // Whether reasoning_tokens is already included in output_tokens
  // because the vendor said so out of band (OpenAI's
  // `X-Reasoning-Included`). Absent means "not stated", which the kernel
  // treats as the documented default for reasoning_tokens above: a
  // distinct count, not folded in. Set true only on a vendor's explicit
  // signal — it exists to stop the kernel double-counting reasoning in
  // its own estimates, so guessing defeats the purpose.
  optional bool reasoning_already_counted = 10;
}

// VendorCost is a vendor's own price for one completion, in whatever
// unit that vendor bills in.
//
// The amount is a decimal string rather than a double because these are
// exact monetary quantities and binary floating point cannot represent
// them exactly — a ledger that must reconcile against an invoice cannot
// afford the rounding.
message VendorCost {
  // The amount, as an exact decimal string ("0.00241", "24100000").
  // MUST parse as a decimal number; MUST NOT carry a currency symbol,
  // thousands separators, or exponent notation.
  string amount = 1;

  // The unit `amount` is denominated in, naming the vendor's own scale
  // where it is not plain currency: "usd", "xai_ticks_1e10". Opaque to
  // the kernel, which never converts between units — a conversion the
  // kernel invented would be one more unaudited number in the ledger.
  string unit = 2;

  // The ISO 4217 currency, when `unit` is a currency-denominated one and
  // the vendor bills in something other than USD.
  optional string currency = 3;
}

// UsageComponent is one vendor-defined counter the protocol has no
// typed field for.
//
// A repeated name/value pair rather than a growing list of optional
// int64s because the set is vendor-specific and open-ended: every vendor
// meters a slightly different decomposition, and promoting each one to a
// field would churn this message on every provider added.
message UsageComponent {
  // The counter's vendor-facing name, verbatim
  // ("input_image_tokens", "num_sources_used",
  // "accepted_prediction_tokens"). MUST be set and MUST be unique within
  // one Usage.
  string name = 1;

  // The counter's value. Named `value` rather than `tokens` because not
  // every vendor counter is a token count — `num_sources_used` counts
  // documents.
  int64 value = 2;
}

// RateLimitKind names which vendor budget a RateLimitSnapshot describes.
enum RateLimitKind {
  // Zero value. Never valid on a real snapshot; its presence on the wire
  // means an adapter forgot to set the field.
  RATE_LIMIT_KIND_UNSPECIFIED = 0;
  // Requests per window.
  RATE_LIMIT_KIND_REQUESTS = 1;
  // Tokens per window, undifferentiated by direction.
  RATE_LIMIT_KIND_TOKENS = 2;
  // Input tokens per window, where the vendor meters them separately.
  RATE_LIMIT_KIND_INPUT_TOKENS = 3;
  // Output tokens per window, where the vendor meters them separately.
  RATE_LIMIT_KIND_OUTPUT_TOKENS = 4;
  // A credit or currency balance metered independently of requests and
  // tokens, as subscription products bill overage against.
  RATE_LIMIT_KIND_CREDITS = 5;
}

// WindowRole distinguishes the several budgets a subscription product
// meters at once, where one is the headline limit and the others
// constrain bursts within it.
//
// Without it an adapter facing a product that publishes a primary and a
// secondary window has to pick one RateLimitKind for each and hope the
// frontend guesses right — the mapping 27-missing-openai-protocol.md
// calls a "semantic lie".
enum WindowRole {
  // Zero value: the vendor publishes one undifferentiated budget, or
  // says nothing about role. Not an error.
  WINDOW_ROLE_UNSPECIFIED = 0;
  // The headline budget an operator thinks of as "my limit".
  WINDOW_ROLE_PRIMARY = 1;
  // A shorter or narrower budget that constrains bursts inside the
  // primary one.
  WINDOW_ROLE_SECONDARY = 2;
}

// RateLimitSnapshot is one of the vendor's rate-limit budgets as of one
// completion, per model/data-types.md#streamevent.
//
// Every numeric field is optional because vendors publish different
// subsets: an adapter reports what its vendor actually returned and omits
// the rest rather than inventing a value. A snapshot with only `kind` set
// is still useful — it says the budget exists.
message RateLimitSnapshot {
  // Which budget this describes. MUST be set.
  RateLimitKind kind = 1;

  // How much of this budget remains.
  optional int64 remaining = 2;

  // This budget's ceiling for the current window.
  optional int64 limit = 3;

  // When this budget next resets.
  optional google.protobuf.Timestamp reset_at = 4;

  // The vendor's stable identifier for this budget, where it names one
  // ("codex", "codex_other"). Opaque to the kernel; it exists so two
  // snapshots of the same budget can be correlated across completions
  // even when kind and window_role are identical.
  optional string limit_id = 5;

  // A human-facing label for this budget, when the vendor supplies one
  // worth showing. Never synthesized from limit_id — a frontend can fall
  // back to kind and window_role perfectly well, and an invented label
  // reads as authoritative.
  optional string limit_name = 6;

  // Which of the vendor's several budgets this is.
  WindowRole window_role = 7;

  // How much of this budget is spent, 0-100, for the products that
  // publish only a percentage and never absolute counts.
  //
  // This exists so those adapters stop faking `limit = 100` and
  // `remaining = 100 - percent` to fit the absolute fields. A vendor
  // publishing real counts sets remaining/limit and leaves this unset; a
  // vendor publishing only a percentage sets this and leaves those
  // unset. An adapter MUST NOT derive one form from the other.
  optional double used_percent = 8;

  // The budget window's length. Paired with reset_at it lets a frontend
  // say "5 hours" rather than only "resets at 14:00", which is what
  // makes a limit predictable instead of a surprise.
  optional int64 window_seconds = 9;
}

// ModelTarget describes the model a context or memory contribution is
// being assembled for, derived from that model's ModelSpec
// (model.md §2). Carried on context.md's ContextRequest and memory.md's
// RecallRequest so a provider can tailor its contribution (and compute
// tokens against the right budget) for the model that will actually
// consume it.
message ModelTarget {
  // The target model's ModelSpec.id (model.md §2) — the vendor's exact
  // model identifier.
  string id = 1;

  // The target model's total input token budget (model.md §2
  // ModelSpec.context_window).
  int64 context_window = 2;

  // The usable portion of context_window after the kernel reserves space
  // for expected output, tool schemas, and other fixed overhead for this
  // turn — the number a context/memory provider should actually budget
  // its contribution against, rather than the raw context_window.
  int64 effective_ceiling = 3;
}

// ModelRef narrowly selects a model for token-counting purposes
// (kernel-callbacks.md §2 CountTokensRequest.model_ref). Optional on the
// request it's embedded in — omitted means "use the kernel's fallback
// heuristic," never "count against an unspecified model."
message ModelRef {
  // The declared name of the model provider plugin (common.v1.ProducerRef
  // or ProviderRef's name field), e.g. "anthropic".
  string provider = 1;

  // The model's ModelSpec.id within that provider.
  string id = 2;
}
