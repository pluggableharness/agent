syntax = "proto3";

package pluggableharness.model.v1;

import "pluggableharness/model/v1/errors.proto";
import "pluggableharness/model/v1/types.proto";

option go_package = "github.com/pluggableharness/agent/pkg/model/proto/v1;modelv1";

// Occurrence-shaped messages streamed by ModelService.StreamCompletion.

// StreamEvent is one message in the stream StreamCompletion returns, per
// model.md §4. Exactly one variant is set.
message StreamEvent {
  oneof event {
    // An incremental fragment of assistant text output.
    TextDelta text_delta = 1;
    // An incremental fragment of the model's reasoning output.
    ThinkingDelta thinking_delta = 2;
    // The vendor's opaque integrity token for the reasoning just emitted.
    ThinkingSignature thinking_signature = 3;
    // The model has begun requesting a tool invocation.
    ToolCallStart tool_call_start = 4;
    // An incremental fragment of a tool call's arguments.
    ToolCallDelta tool_call_delta = 5;
    // A tool call's arguments are complete.
    ToolCallDone tool_call_done = 6;
    // Token accounting for this completion.
    Usage usage = 7;
    // The completion has ended.
    Stop stop = 8;
    // The completion failed.
    Error error = 9;
    // A complete, vendor-encrypted reasoning block the kernel cannot
    // interpret.
    RedactedThinking redacted_thinking = 10;
    // The vendor has accepted the request and named it.
    StreamStart stream_start = 11;
    // Non-content facts about how the vendor is serving this request.
    StreamMetadata metadata = 12;
    // The vendor is interposing on this request.
    SafetyNotice safety_notice = 13;
  }

  // StreamStart carries the vendor's own identifier for this request, as
  // soon as the adapter learns it — normally from response headers,
  // before any content streams.
  //
  // It exists so a failure can be correlated with the vendor's own logs
  // when asking them what went wrong. That is why it is a separate event
  // emitted early rather than a field on Stop: an id that only arrives on
  // successful completion is absent in exactly the case it is needed.
  // MAY be omitted entirely by a vendor that publishes no such id.
  message StreamStart {
    // The vendor's request identifier, verbatim (an Anthropic
    // `request-id` header, an OpenAI `x-request-id`). Opaque to the
    // kernel: logged and surfaced, never parsed.
    string provider_request_id = 1;

    // Every other handle this request is known by, keyed by the
    // vendor's own name for it ("x-request-id", "response_id",
    // "cf-ray").
    //
    // One id is not enough in practice: vendors log the same request
    // under several, and a support conversation asks for whichever one
    // that vendor's own tooling indexes. provider_request_id stays the
    // single canonical handle; this carries the rest rather than forcing
    // an adapter to choose which to discard.
    //
    // The kernel MUST serialize this with sorted keys wherever it
    // reaches a persisted payload (.claude/rules/determinism.md).
    map<string, string> correlation_ids = 2;
  }

  // StreamMetadata carries non-content facts about how the vendor is
  // serving this request: which model actually answered, which build,
  // which tier, and whatever budget state the response headers exposed.
  //
  // Separate from StreamStart because these arrive on a different
  // schedule. StreamStart is emitted once when the vendor accepts the
  // request; metadata may not be knowable until headers land, may
  // change mid-stream, and MAY be emitted more than once — a later event
  // supersedes an earlier one field by field, and an absent field means
  // "no new information", never "cleared".
  //
  // This is not a block boundary. It carries no content, so a kernel
  // accumulating a message MUST NOT close an open text or thinking block
  // on receiving one; doing so would split a run of deltas that a vendor
  // happened to interrupt with a late header.
  message StreamMetadata {
    // The model that actually served this completion, when it differs
    // from the requested StreamCompletionRequest.model_id — vendors
    // remap for safety routing, capacity, and deprecation
    // (`grok-4` resolving to `grok-4.3`).
    //
    // Load-bearing for trust, not just for ops. A vendor silently
    // serving a different model is how an operator experiences "it got
    // worse today" with nothing to point at; dropping the fact makes
    // the regression unattributable and, worse, makes the kernel's own
    // cost computation cite pricing for a model that never ran.
    optional string actual_model = 1;

    // The vendor's opaque identifier for the backend build serving this
    // request (OpenAI's `system_fingerprint`). Never parsed.
    optional string system_fingerprint = 2;

    // The service or speed tier this request was served at, where the
    // vendor exposes tiers that differ in latency or price.
    optional string service_tier = 3;

    // Budget state as of this point in the stream, when the vendor
    // publishes it in response headers rather than in the terminal usage
    // payload.
    //
    // The same RateLimitSnapshot shape Usage carries. Reported here it
    // is visible while a long completion is still running, which is the
    // whole point: a limit an operator learns about only after the turn
    // that exhausted it has already stranded them.
    repeated RateLimitSnapshot rate_limits = 4;

    // The context window the vendor says applies to this request, when
    // it reports one that supersedes the roster's static figure
    // (xAI's `x-grok-context-window`).
    optional int64 live_context_window = 5;

    // The maximum output token count the vendor says applies to this
    // request, on the same terms as live_context_window.
    optional int64 live_max_output_tokens = 6;

    // The vendor's current model-catalog version, when a response
    // advertises one (xAI's `x-models-etag`). A value differing from the
    // one the loaded roster was built from means the catalog moved.
    optional string catalog_etag = 7;

    // Vendor-defined metadata with no typed field above. Opaque to the
    // kernel, which stores and surfaces it without interpretation.
    //
    // The kernel MUST serialize this with sorted keys wherever it
    // reaches a persisted payload (.claude/rules/determinism.md).
    map<string, string> attrs = 8;

    // A handle to this turn's vendor-side state, for vendors that accept
    // an incremental continuation on the next request. The kernel passes
    // it back as StreamCompletionRequest.sticky_turn_token.
    optional string sticky_turn_token = 9;
  }

  // TextDelta carries one incremental fragment of assistant text output.
  // MUST be supported by every plugin, both directions (model.md §5).
  message TextDelta {
    // The text fragment.
    string text = 1;
  }

  // ThinkingDelta carries one incremental fragment of the model's
  // reasoning output. Only emitted when the target model's
  // ThinkingSpec.supported is true.
  message ThinkingDelta {
    // The reasoning-text fragment.
    string text = 1;

    // Which reasoning stream this fragment belongs to, for vendors that
    // emit a readable summary alongside (or instead of) raw reasoning.
    //
    // UNSPECIFIED means the vendor draws no distinction, which is the
    // correct reading for every provider written before this field and
    // the reason it is not a required field.
    ThinkingChannel channel = 2;

    // Which reasoning part this fragment belongs to, where a vendor
    // emits several in parallel. Fragments sharing a part_index within a
    // channel are one block; absent means a single part.
    //
    // Unlike tool calls, which correlate by an explicit id, reasoning
    // fragments have historically been correlated by adjacency alone —
    // this makes a vendor's own part structure representable without
    // changing that default.
    optional int32 part_index = 3;
  }

  // ThinkingChannel distinguishes a vendor's reasoning streams.
  enum ThinkingChannel {
    // The vendor draws no distinction between reasoning streams.
    THINKING_CHANNEL_UNSPECIFIED = 0;
    // The model's raw reasoning output.
    THINKING_CHANNEL_CONTENT = 1;
    // A vendor-generated readable summary of the reasoning, which is
    // typically what a frontend should show when both are present.
    THINKING_CHANNEL_SUMMARY = 2;
  }

  // SafetyNotice reports that the vendor is interposing on this request:
  // holding output for review, applying a moderation decision, or
  // requiring an account challenge before continuing.
  //
  // It carries no content and is not a block boundary. A kernel that does
  // not understand a given kind MUST ignore the event rather than failing
  // the turn — this exists so a frontend can explain a stall, and an
  // unexplained stall is strictly worse than an unrecognized notice.
  message SafetyNotice {
    // What the vendor is doing.
    SafetyKind kind = 1;

    // A human-readable explanation, where the vendor supplies one worth
    // showing. Never synthesized.
    optional string message = 2;

    // Vendor-defined detail with no typed field. The kernel MUST
    // serialize this with sorted keys wherever it reaches a persisted
    // payload (.claude/rules/determinism.md).
    map<string, string> attrs = 3;
  }

  // SafetyKind names the vendor interventions a SafetyNotice reports.
  enum SafetyKind {
    // Zero value. Never valid on a real notice.
    SAFETY_KIND_UNSPECIFIED = 0;
    // Output is being buffered for review before release, so a stall is
    // expected and is not a hang.
    SAFETY_KIND_BUFFERING = 1;
    // A moderation decision was applied to this request.
    SAFETY_KIND_MODERATION = 2;
    // The account must complete a challenge before the request can
    // proceed. The kernel cannot satisfy this itself; surfacing it is
    // what lets an operator go and do so.
    SAFETY_KIND_VERIFICATION_REQUIRED = 3;
  }

  // ThinkingSignature carries the vendor's opaque integrity token for the
  // reasoning block just completed. MUST be emitted if the vendor's
  // thinking blocks carry an integrity signature (model.md §4/§5); the
  // kernel MUST store and round-trip this verbatim, never inspecting or
  // reformatting it, into ContentBlock's ThinkingBlock.signature.
  message ThinkingSignature {
    // The opaque, vendor-specific signature bytes.
    bytes signature = 1;
  }

  // ToolCallStart announces the model has begun requesting a tool
  // invocation.
  message ToolCallStart {
    // Correlation id for the matching ToolCallDelta/ToolCallDone events
    // and the resulting ToolUseBlock.id.
    string id = 1;
    // The tool's declared name (ToolDeclaration.name).
    string name = 2;
  }

  // ToolCallDelta carries one incremental fragment of a tool call's
  // arguments, accumulated by the kernel across deltas into the final
  // parsed JSON.
  message ToolCallDelta {
    // The id from the matching ToolCallStart.
    string id = 1;
    // A partial-JSON fragment of the call's arguments.
    string arguments_fragment = 2;
  }

  // ToolCallDone signals a tool call's arguments are complete and ready
  // for the kernel to parse and dispatch.
  message ToolCallDone {
    // The id from the matching ToolCallStart.
    string id = 1;
  }

  // Stop signals the completion has ended.
  message Stop {
    // Why the completion ended.
    StopReason reason = 1;

    // Which GenerationParams.stop_sequences entry was matched. Set iff
    // reason == STOP_REASON_STOP_SEQUENCE; MUST be omitted for every
    // other reason.
    optional string matched_stop_sequence = 2;

    // Whether the vendor reported that the model itself declared the turn
    // finished, as opposed to the stream merely ending.
    //
    // STOP_REASON_END_TURN already covers the ordinary case; this
    // separates "the model said it was done" from "nothing further
    // arrived", which vendors exposing an explicit end-of-turn signal can
    // distinguish and the kernel otherwise cannot. Absent means the
    // vendor said nothing, not that the model failed to affirm.
    optional bool model_affirmed = 3;
  }

  // Error signals the completion failed.
  message Error {
    // The structured error, classified per model.md §8.
    ModelError error = 1;
  }

  // RedactedThinking carries one complete, vendor-encrypted reasoning
  // block — not an incremental fragment, unlike ThinkingDelta: the
  // vendor emits the block whole because its contents are deliberately
  // opaque, so there is nothing to accumulate. MUST be emitted whenever
  // the vendor produces reasoning content it requires be echoed back
  // verbatim on a later turn (model.md §4/§5); the kernel MUST store and
  // round-trip it without inspecting it, into ContentBlock's
  // RedactedThinkingBlock.data. Only emitted when the target model's
  // ThinkingSpec.supported is true.
  message RedactedThinking {
    // The opaque, vendor-encrypted bytes. The kernel never inspects this.
    bytes data = 1;
  }
}

// StopReason classifies why a StreamCompletion ended, per model.md §4.
enum StopReason {
  // Zero value. Never valid on a real Stop event; its presence on the
  // wire means a caller forgot to set the field.
  STOP_REASON_UNSPECIFIED = 0;
  // The model completed its turn normally.
  STOP_REASON_END_TURN = 1;
  // The model stopped to request one or more tool invocations.
  STOP_REASON_TOOL_USE = 2;
  // The model hit its output token limit before completing its turn.
  STOP_REASON_MAX_TOKENS = 3;
  // The vendor's content filter stopped generation.
  STOP_REASON_CONTENT_FILTERED = 4;
  // The kernel cancelled the stream (user interrupt, timeout, turn
  // abort). MUST be treated by the plugin as normal control flow, never
  // as an error (model.md §1, .claude/rules/grpc.md).
  STOP_REASON_CANCELLED = 5;
  // The model or vendor refused to continue generating — distinct from
  // STOP_REASON_CONTENT_FILTERED, which is the vendor's automated content
  // filter stopping generation; REFUSAL is the model itself declining
  // (e.g. a safety-trained refusal message), a semantically different
  // event even though both are policy-driven stops.
  STOP_REASON_REFUSAL = 6;
  // The model stopped because it generated one of
  // GenerationParams.stop_sequences. Stop.matched_stop_sequence carries
  // which one.
  STOP_REASON_STOP_SEQUENCE = 7;
}
