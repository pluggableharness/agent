syntax = "proto3";

// Package pluggableharness.session.v1 defines the session lifecycle status
// enum shared by kernel-callbacks.md's RunSessionResult and
// state-backend.md's session_meta.status column, plus SessionInfo and the
// frontend-facing SessionState snapshot ("where am I") assembled by
// KernelCallbackService.GetSessionState.
package pluggableharness.session.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "pluggableharness/model/v1/types.proto";

option go_package = "github.com/pluggableharness/agent/pkg/session/proto/v1;sessionv1";

// SessionStatus is a session's lifecycle state. RUNNING is the only value
// a live (non-terminal) session can be in; every other value is terminal.
// agent-loop.md §7.1's RunSessionResult never carries RUNNING (a
// RunSession call only returns once its child session has reached a
// terminal state) — it reuses this same enum rather than defining a
// narrower terminal-only one, since the two are the same status space
// observed at different times.
enum SessionStatus {
  // Zero value. Never valid on the wire; its presence means a caller
  // forgot to set the field.
  SESSION_STATUS_UNSPECIFIED = 0;
  // The session is still in progress.
  SESSION_STATUS_RUNNING = 1;
  // The session finished normally.
  SESSION_STATUS_COMPLETED = 2;
  // The session hit its configured max-turns bound (agent-loop.md §3.2).
  SESSION_STATUS_ERROR_MAX_TURNS = 3;
  // The session hit its configured max-cost-USD bound.
  SESSION_STATUS_ERROR_MAX_BUDGET_USD = 4;
  // The session hit its configured max-wall-clock bound.
  SESSION_STATUS_ERROR_MAX_WALL_CLOCK = 5;
  // The session was cancelled (user interrupt, parent cancellation
  // propagation per agent-loop.md §7.7).
  SESSION_STATUS_CANCELLED = 6;
  // The session ended due to an unrecoverable error.
  SESSION_STATUS_FAILED = 7;
}

// SessionInfo is a session's shareable summary, mirroring
// state-backend.md's session_meta row plus a cheap cost_ledger SUM. Used
// by session lifecycle RPCs (CreateSession/AttachSession/ListSessions)
// and embedded inside SessionState — the frontend protocol's read-only
// view of session lifecycle state, never mutated by a frontend directly.
message SessionInfo {
  // The session's id. ULID, matches the session's sqlite filename stem
  // (state-backend.md §"File layout").
  string session_id = 1;

  // The parent session's id, when this is a sub-agent session
  // (agent-loop/subagents.md). Absent for a root session — mirrors
  // session_meta.parent_session_id.
  optional string parent_session_id = 2;

  // The agent.hcl profile this session was created under.
  string profile = 3;

  // The session's current lifecycle status.
  SessionStatus status = 4;

  // The session's depth in its ancestor chain — mirrors
  // session_meta.depth (agent-loop/subagents.md#depth-limits).
  int32 depth = 5;

  // When the session was created. Mirrors session_meta.started_at.
  google.protobuf.Timestamp started_at = 6;

  // When the session reached a terminal status. Absent while RUNNING.
  // Mirrors session_meta.ended_at.
  optional google.protobuf.Timestamp ended_at = 7;

  // The session's running total spend — SUM(cost_usd) over
  // state-backend.md's cost_ledger table for this session. Absent if no
  // cost has been incurred yet, rather than a meaningless zero.
  optional double cost_usd = 8;
}

// VcsState is the session's version-control summary for status rendering.
// Absent fields mean "unknown / not a VCS working tree," not empty.
message VcsState {
  // The remote tracking URL or name, when known.
  optional string remote = 1;
  // The current branch or detached-HEAD ref name, when known.
  optional string branch = 2;
  // True when the working tree has uncommitted changes. Absent when VCS
  // state could not be determined.
  optional bool dirty = 3;
}

// ModelState names the model currently driving the session.
message ModelState {
  // The model's id within its provider (ModelSpec.id).
  string id = 1;
  // The declared name of the model provider plugin.
  string provider = 2;
}

// ContextState is the session's context-window pressure for status bars.
message ContextState {
  // Tokens currently used against the window.
  int64 used_tokens = 1;
  // The usable context window size in tokens (effective ceiling).
  int64 window_tokens = 2;
}

// SessionState is the fixed-schema "where am I" snapshot a frontend
// renders into a status bar, HTTP header, stdout line, or spoken sentence.
// Assembled by KernelCallbackService.GetSessionState and republished on
// the event bus topic kernel.state whenever a watched field changes.
// Per-session: every snapshot names exactly one session. No extension
// point — a closed schema is what makes every frontend able to render it.
message SessionState {
  // The session's shareable lifecycle summary. MUST be set.
  SessionInfo info = 1;

  // Absolute working directory for this session. MUST be set once the
  // session has one; empty only before CreateSession finishes binding it.
  string working_directory = 2;

  // Version-control summary for working_directory. Absent when not a
  // VCS tree or not yet probed.
  optional VcsState vcs = 3;

  // The model currently selected for this session's turns. Absent only
  // before the first model resolution.
  optional ModelState model = 4;

  // The active thinking/effort level name for the current model, when
  // the model exposes an effort ladder. Absent when thinking is off or
  // the model has no effort control.
  optional string thinking_effort = 5;

  // Context-window pressure. Absent only before the first turn's usage
  // is known.
  optional ContextState context = 6;

  // Number of completed turns in this session.
  int32 turn_count = 7;

  // Wall-clock time since info.started_at. MUST be set for a live
  // session; for a terminal session equals ended_at - started_at.
  google.protobuf.Duration elapsed = 8;

  // Session-lifetime total tokens (input + output), summed from the cost
  // ledger / usage rollups. Zero when no model call has completed yet.
  int64 total_tokens = 9;

  // The vendor budgets reported by the most recent completion, from that
  // completion's Usage or StreamMetadata.
  //
  // Distinct from account.quotas below: these are per-completion
  // readings taken from response headers as turns run, while
  // account.quotas is the account-level snapshot GetAccount returns
  // independently of any completion. A subscription product typically
  // publishes both, and they refresh on different schedules.
  //
  // MAY be empty — a vendor that publishes no budgets has nothing here,
  // and the kernel MUST NOT synthesize an entry from its own token
  // counting.
  repeated pluggableharness.model.v1.RateLimitSnapshot quotas = 10;

  // The account and entitlement state behind the session's model
  // provider, from GetAccount. Absent when the provider does not
  // implement that RPC, which is the common case for a bare API key.
  optional pluggableharness.model.v1.AccountSnapshot account = 11;

  // What the vendor said the most recent completion cost, in its own
  // denomination.
  //
  // Reported beside info.cost_usd, never instead of it: cost_usd remains
  // the kernel's computed figure and the one every rollup and budget
  // reads. This is here so a frontend can show that list price and
  // actual bill disagree — and so a subscription session, where computed
  // cost is structurally 0.00, has something truthful to display.
  optional pluggableharness.model.v1.VendorCost vendor_cost = 12;

  // The model that actually served the most recent completion, when the
  // vendor remapped it away from the requested id.
  //
  // Surfaced at session level because silent model substitution is
  // otherwise invisible: an operator sees only that answers got worse,
  // with nothing in the UI to attribute it to. Absent means the vendor
  // served what was asked for, or said nothing.
  optional string actual_model = 13;

  // What the session is doing right now, as opposed to info.status, which
  // is where the session sits in its lifecycle.
  //
  // The two answer different questions and a status bar needs the second
  // one: a session is `running` from creation until it ends, so a frontend
  // driven by status alone reads "running" while idle at the prompt and
  // "running" while a model call is in flight. Phase is what distinguishes
  // them.
  SessionPhase phase = 14;
}

// SessionPhase is what a session is doing at this instant.
//
// Deliberately short. Every value here is one a frontend renders
// differently; a phase nothing displays differently is a log line, not
// protocol. Finer breakdowns (which tool, which turn step) are already
// available as events on the transcript.
enum SessionPhase {
  // Zero value: the session has not reported a phase. A frontend SHOULD
  // treat this as IDLE rather than rendering an unknown state — a session
  // that never reports is not working.
  SESSION_PHASE_UNSPECIFIED = 0;
  // Nothing is in flight; the session is waiting on the operator.
  SESSION_PHASE_IDLE = 1;
  // A turn is in flight — the model is being called, or its tool calls
  // are running.
  SESSION_PHASE_GENERATING = 2;
}
