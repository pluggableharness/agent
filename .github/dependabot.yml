# =============================================================================
# Dependabot — automated dependency updates for both surfaces this repo has:
# the Go module graph and the actions the workflows themselves run on.
#
# Design decisions:
#   - Grouped updates: minor/patch bumps arrive as one PR per ecosystem per
#     week instead of a PR per dependency. Major Go bumps stay individual —
#     they carry breaking changes and deserve their own review.
#   - Cooldowns: never take a release the day it ships; let upstream pull a
#     bad tag first. Majors wait a full week.
#   - Commit prefixes ("deps"/"ci") keep Dependabot commits greppable;
#     Dependabot's default "dependencies" label routes its PRs into the
#     Dependencies section of auto-generated release notes (.github/release.yml).
#
# Every Dependabot PR still runs the full CI/lint/security gate — merging
# one is a reviewed action, not an auto-merge.
# =============================================================================

version: 2
updates:
  # Every Go module in the tree needs its own entry — Dependabot resolves a
  # directory, not a repository. examples/provider is a separate module by
  # design (it exists to prove pkg/ builds from outside the main one), so a
  # bump to the root go.mod leaves its pinned versions untouched. That is
  # not cosmetic: CI runs `go mod tidy` there and fails on any diff, so
  # omitting it turns every future root-module bump into a red main.
  # Same failure mode the composite-action note below describes.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples/provider"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # "/" covers .github/workflows. Composite actions are not picked up by it —
  # each one's directory has to be listed, or the SHAs pinned inside it go
  # stale silently while the workflows around it stay current.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-go-cached"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
